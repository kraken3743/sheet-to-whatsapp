<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
  <title>Schedule Sheet to WhatsApp</title><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    ...same styles...
  </style></head><body>
  <div class="container">
    <div class="left">
      <h2>Schedule Screenshot</h2>
      <form method="POST" action="/register">
        <label>Google Sheet URL:</label>
        <input type="text" name="sheet_url" required value="https://docs.google.com/spreadsheets/d/1_QSvPyOCCP43AZ6eZqNIm4OmJb8ds9EB4UD88C2-Sb4/edit?gid=909429816#gid=909429816">

        <label>WhatsApp Number:</label><input type="text" name="whatsapp_number" required>
        <label>Time(s) (HH:MM comma-separated):</label><input type="text" name="times" required placeholder="e.g. 13:45,18:30">
        <label>Crop Left (px):</label><input type="number" name="crop_left" value="20">
        <label>Crop Top (px):</label><input type="number" name="crop_top" value="130">
        <label>Crop Right (px):</label><input type="number" name="crop_right" value="1000">
        <label>Crop Bottom (px):</label><input type="number" name="crop_bottom" value="900">
        <label>Repeat days:</label><input type="number" name="num_days" value="3" min="1">
        <button type="submit">Schedule</button>
      </form>
    </div>
    <div class="right">
      <h2>Cancel</h2>
      <form method="POST" action="/cancel">
        <label>WhatsApp Number:</label><input type="text" name="whatsapp_number" required>
        <button type="submit">Cancel</button>
      </form>
    </div>
  </div>
</body></html>
