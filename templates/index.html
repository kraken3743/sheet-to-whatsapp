<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Schedule Google Sheet to WhatsApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      max-width: 600px;
      width: 100%;
    }

    h2 {
      text-align: center;
      color: #333366;
    }

    label {
      font-weight: bold;
      margin-top: 12px;
      display: block;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      background: linear-gradient(to right, #6a11cb, #2575fc);
      color: white;
      border: none;
      font-size: 1em;
      margin-top: 20px;
      cursor: pointer;
    }

    button:hover {
      background: linear-gradient(to right, #5c0ec1, #1e65e2);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Schedule Screenshot</h2>
    <form method="POST" action="/register">
      <label>WhatsApp Number:</label>
      <input type="text" name="whatsapp_number" required>

      <label>Time(s) (comma separated in 24hr e.g. 09:45,23:15):</label>
      <input type="text" name="times" required>

      <label>Additional Google Sheet URL (optional):</label>
      <input type="text" name="custom_sheet_url">

      <label>Crop Left (px):</label>
      <input type="number" name="crop_left" value="30">

      <label>Crop Top (px):</label>
      <input type="number" name="crop_top" value="165">

      <label>Crop Right (px):</label>
      <input type="number" name="crop_right" value="1650">

      <label>Crop Bottom (px):</label>
      <input type="number" name="crop_bottom" value="1250">

      <button type="submit">Schedule</button>
    </form>
  </div>
</body>
</html>
