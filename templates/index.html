<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sheet to WhatsApp Scheduler</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      max-width: 850px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
    }

    .form-section {
      flex: 1;
      min-width: 280px;
    }

    h2 {
      text-align: center;
      color: #333366;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 10px 0 4px;
      font-weight: 600;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background: linear-gradient(to right, #6a11cb, #2575fc);
      border: none;
      padding: 12px;
      color: white;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-section">
      <h2>Schedule Screenshot</h2>
      <form method="POST" action="/register">
        <label>Google Sheet URL:</label>
        <input type="text" name="sheet_url" required
          value="https://docs.google.com/spreadsheets/d/1_QSvPyOCCP43AZ6eZqNIm4OmJb8ds9EB4UD88C2-Sb4/edit#gid=909429816">

        <label>WhatsApp Number:</label>
        <input type="text" name="whatsapp_number" required>

        <label>Time(s) (comma separated HH:MM):</label>
        <input type="text" name="times" required placeholder="e.g. 13:45,19:30">

        <label>Repeat for how many days?</label>
        <input type="number" name="num_days" value="3" min="1">

        <label>Crop Left (px):</label>
        <input type="number" name="crop_left" value="20">

        <label>Crop Top (px):</label>
        <input type="number" name="crop_top" value="130">

        <label>Crop Right (px):</label>
        <input type="number" name="crop_right" value="1000">

        <label>Crop Bottom (px):</label>
        <input type="number" name="crop_bottom" value="900">

        <button type="submit">Schedule</button>
      </form>
    </div>

    <div class="form-section">
      <h2>Cancel Schedule</h2>
      <form method="POST" action="/cancel">
        <label>WhatsApp Number:</label>
        <input type="text" name="whatsapp_number" required>
        <button type="submit">Cancel</button>
      </form>
    </div>
  </div>
</body>
</html>
