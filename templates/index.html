<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Schedule Google Sheet to WhatsApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      overflow: auto;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      max-width: 600px;
      width: 100%;
      box-sizing: border-box;
    }

    h2 {
      text-align: center;
      color: #333366;
    }

    label {
      font-weight: bold;
      margin-top: 12px;
      display: block;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      background: linear-gradient(to right, #6a11cb, #2575fc);
      color: white;
      border: none;
      font-size: 1em;
      margin-top: 20px;
      cursor: pointer;
    }

    button:hover {
      background: linear-gradient(to right, #5c0ec1, #1e65e2);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Schedule Screenshot</h2>
    <form method="POST" action="/register">
      <label>Extra Google Sheet URL (optional):</label>
      <input type="text" name="extra_url" placeholder="https://...">

      <label>WhatsApp Number:</label>
      <input type="text" name="whatsapp_number" required>

      <label>Time(s) (24hr format, e.g. 09:45,23:15):</label>
      <input type="text" name="times" required>

      <label>Crop Left (px):</label>
      <input type="number" name="crop_left" value="30">

      <label>Crop Top (px):</label>
      <input type="number" name="crop_top" value="155">

      <label>Crop Right (px):</label>
      <input type="number" name="crop_right" value="1450">

      <label>Crop Bottom (px):</label>
      <input type="number" name="crop_bottom" value="1150">

      <button type="submit">Schedule</button>
    </form>
  </div>
</body>
</html>
