<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Schedule Sheet to WhatsApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      width: 400px;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    label {
      margin-top: 15px;
      display: block;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 20px;
      width: 100%;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: linear-gradient(to right, #5a0eb3, #1a5fd8);
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Schedule Screenshot</h2>
    <form method="POST" action="/register">
      <label>Google Sheet URL:</label>
      <input type="text" name="sheet_url" required value="https://docs.google.com/spreadsheets/d/1_QSvPyOCCP43AZ6eZqNIm4OmJb8ds9EB4UD88C2-Sb4/edit?gid=909429816#gid=909429816"/>

      <label>WhatsApp Number:</label>
      <input type="text" name="whatsapp_number" required />

      <label>Time (24hr format HH:MM):</label>
      <input type="text" name="time" required placeholder="e.g. 14:30"/>

      <label>Crop Left (px):</label>
      <input type="number" name="crop_left" value="20" />

      <label>Crop Top (px):</label>
      <input type="number" name="crop_top" value="130" />

      <label>Crop Right (px):</label>
      <input type="number" name="crop_right" value="1000" />

      <label>Crop Bottom (px):</label>
      <input type="number" name="crop_bottom" value="900" />

      <button type="submit">Schedule</button>
    </form>
  </div>
</body>
</html>
