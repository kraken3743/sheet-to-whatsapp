<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Schedule Sheet to WhatsApp</title>
  <style>
    body {
      background: linear-gradient(to right, #6a11cb, #2575fc);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      width: 400px;
    }

    h2 {
      text-align: center;
      color: #333366;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: linear-gradient(to right, #2575fc, #6a11cb);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Schedule Sheet</h2>
    <form method="POST" action="/register">
      <label>Sheet URL</label>
      <input type="text" name="sheet_url" required
        value="https://docs.google.com/spreadsheets/d/1_QSvPyOCCP43AZ6eZqNIm4OmJb8ds9EB4UD88C2-Sb4/edit?gid=909429816#gid=909429816">

      <label>WhatsApp Number</label>
      <input type="text" name="whatsapp_number" required placeholder="+91XXXXXXXXXX">

      <label>Time (HH:MM 24hr)</label>
      <input type="text" name="time" required placeholder="14:30">

      <label>Crop Left</label>
      <input type="number" name="crop_left" value="20">

      <label>Crop Top</label>
      <input type="number" name="crop_top" value="130">

      <label>Crop Right</label>
      <input type="number" name="crop_right" value="1000">

      <label>Crop Bottom</label>
      <input type="number" name="crop_bottom" value="900">

      <button type="submit">Schedule</button>
    </form>
    <form method="POST" action="/cancel">
      <label>Cancel (WhatsApp Number)</label>
      <input type="text" name="whatsapp_number" required placeholder="+91XXXXXXXXXX">
      <button type="submit">Cancel Schedule</button>
    </form>
  </div>
</body>
</html>
