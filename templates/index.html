<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scheduler – 12 hr & Date Range</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    /* same styles as previous improved UI */
  </style>
</head>
<body>
  <div class="container">
    <div class="form-section">
      <h2>Schedule Screenshot</h2>
      <form method="POST" action="/register">
        <label>Google Sheet URL:</label>
        <input name="sheet_url" type="text" required value="...">

        <label>WhatsApp Number:</label>
        <input name="whatsapp_number" type="text" required>

        <label>Start Date:</label>
        <input name="start_date" type="date" required value="{{datetime.utcnow().date()}}">

        <label>End Date:</label>
        <input name="end_date" type="date" required>

        <label>Time(s) (12 hr, e.g. 01:30 PM):</label>
        <input name="times" type="text" required placeholder="e.g. 01:30 PM,07:45 AM">

        <label>Crop Left (px):</label>
        <input type="number" name="crop_left" value="20">

        <label>Crop Top (px):</label>
        <input type="number" name="crop_top" value="130">

        <label>Crop Right (px):</label>
        <input type="number" name="crop_right" value="1000">

        <label>Crop Bottom (px):</label>
        <input type="number" name="crop_bottom" value="900">

        <button type="submit">Schedule</button>
      </form>
    </div>
    <div class="form-section">
      <h2>Cancel Schedule</h2>
      <form method="POST" action="/cancel">
        <label>WhatsApp Number:</label>
        <input name="whatsapp_number" type="text" required>
        <button type="submit">Cancel</button>
      </form>
    </div>
  </div>
</body>
</html>
