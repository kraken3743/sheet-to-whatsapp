<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Schedule Google Sheet to WhatsApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      max-width: 600px;
      width: 100%;
    }

    h2 {
      text-align: center;
      color: #333366;
    }

    label {
      font-weight: bold;
      margin-top: 12px;
      display: block;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      background: linear-gradient(to right, #6a11cb, #2575fc);
      color: white;
      border: none;
      font-size: 1em;
      margin-top: 20px;
      cursor: pointer;
    }

    button:hover {
      background: linear-gradient(to right, #5c0ec1, #1e65e2);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Schedule Sheet Screenshot</h2>
    <form method="POST" action="/register">
      <label>Google Sheet URL:</label>
      <input type="text" name="sheet_url" required value="https://docs.google.com/spreadsheets/d/1_QSvPyOCCP43AZ6eZqNIm4OmJb8ds9EB4UD88C2-Sb4/edit?gid=909429816#gid=909429816">

      <label>WhatsApp Number:</label>
      <input type="text" name="whatsapp_number" required>

      <label>Time(s) (comma-separated, 24-hr format):</label>
      <input type="text" name="times" required placeholder="e.g. 08:30,14:00">

      <button type="submit">Schedule</button>
    </form>

    <form method="POST" action="/cancel" style="margin-top: 30px;">
      <label>Cancel Schedule - WhatsApp Number:</label>
      <input type="text" name="whatsapp_number" required>
      <button type="submit">Cancel</button>
    </form>
  </div>
</body>
</html>
