<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Schedule Sheet to WhatsApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      max-width: 600px;
      width: 100%;
    }
    h2 {
      text-align: center;
      color: #333366;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 5px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #6a11cb, #2575fc);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1em;
      cursor: pointer;
    }
    button:hover {
      background: linear-gradient(90deg, #5e0ecb, #1f63f2);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Schedule Google Sheet Screenshot</h2>
    <form method="POST" action="/register">
      <label>Google Sheet URL</label>
      <input type="text" name="sheet_url" required value="https://docs.google.com/spreadsheets/d/1_QSvPyOCCP43AZ6eZqNIm4OmJb8ds9EB4UD88C2-Sb4/edit?gid=909429816#gid=909429816">

      <label>WhatsApp Number</label>
      <input type="text" name="whatsapp_number" required>

      <label>Time (24-hr format HH:MM)</label>
      <input type="text" name="time" required placeholder="e.g. 13:45">

      <label>Crop Left (px)</label>
      <input type="number" name="crop_left" value="20">

      <label>Crop Top (px)</label>
      <input type="number" name="crop_top" value="130">

      <label>Crop Right (px)</label>
      <input type="number" name="crop_right" value="1000">

      <label>Crop Bottom (px)</label>
      <input type="number" name="crop_bottom" value="900">

      <button type="submit">Schedule</button>
    </form>
    <form method="POST" action="/cancel">
      <label style="margin-top:25px;">Cancel Schedule (enter number)</label>
      <input type="text" name="whatsapp_number" required>
      <button type="submit">Cancel</button>
    </form>
  </div>
</body>
</html>
