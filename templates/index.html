<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Schedule Sheet to WhatsApp</title>
  <style>
    body {
      background: linear-gradient(to right, #6a11cb, #2575fc);
      font-family: 'Segoe UI', sans-serif;
      color: #333;
      padding: 40px;
      display: flex;
      justify-content: center;
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      width: 600px;
    }

    h2 {
      text-align: center;
      color: #2575fc;
    }

    label {
      margin-top: 15px;
      font-weight: bold;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: linear-gradient(to right, #5b0dcc, #1d63e0);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Schedule Sheet Screenshot</h2>
    <form method="POST" action="/register">
      <label>Sheet URL:</label>
      <input type="text" name="sheet_url" required
             value="https://docs.google.com/spreadsheets/d/1_QSvPyOCCP43AZ6eZqNIm4OmJb8ds9EB4UD88C2-Sb4/edit#gid=909429816">

      <label>WhatsApp Number:</label>
      <input type="text" name="whatsapp_number" required placeholder="+91XXXXXXXXXX">

      <label>Start Date:</label>
      <input type="date" name="start_date" required value="{{ datetime.utcnow().date() }}">

      <label>End Date:</label>
      <input type="date" name="end_date" required>

      <label>Times (e.g. 01:30 PM, 06:45 AM):</label>
      <input type="text" name="times" required placeholder="Comma separated">

      <label>Crop Left:</label>
      <input type="number" name="crop_left" value="20">

      <label>Crop Top:</label>
      <input type="number" name="crop_top" value="130">

      <label>Crop Right:</label>
      <input type="number" name="crop_right" value="1000">

      <label>Crop Bottom:</label>
      <input type="number" name="crop_bottom" value="900">

      <button type="submit">Schedule</button>
    </form>
  </div>
</body>
</html>
